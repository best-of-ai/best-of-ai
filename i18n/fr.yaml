# FAQ text and structured data (partials/*-faq.html, partials/seo-jsonld.html)
fq_lb_best_in: "Quel était le meilleur outil d'IA en {{ .period }} ?"
fq_lb_best_in_a: "{{ .n1 }} était n° 1 en {{ .period }}, devant {{ .n2 }} et {{ .n3 }}. Best of AI classe les outils selon leur utilité et leur impact réels."
fq_lb_current: "Ce classement est-il toujours d'actualité ?"
fq_lb_current_a: "Non. Cette page est un instantané figé du classement de {{ .period }}. Le classement actuel a l'ordre le plus récent."
fq_lb_climb: "Quel outil d'IA a le plus progressé en {{ .period }} ?"
fq_lb_climb_a: "{{ .name }} a gagné {{ .n }} places depuis {{ .prev }}, la plus forte hausse de la liste."
fq_lb_best_now: "Quel est le meilleur outil d'IA en ce moment ?"
fq_lb_best_now_a: "{{ .n1 }} est n° 1 du classement de {{ .period }}, devant {{ .n2 }} et {{ .n3 }}. Le classement reflète l'utilité et l'impact réels, pas seulement les scores de benchmarks."
fq_lb_how: "Comment les outils d'IA sont-ils classés ici ?"
fq_lb_how_a: "Les outils sont classés selon leur utilité et leur impact réels : combien ils aident à faire le travail, à quel point on s'appuie dessus, et combien ils influencent les autres outils. La liste couvre {{ .n }} outils dans {{ .cats }} catégories."
fq_lb_often: "À quelle fréquence le classement est-il mis à jour ?"
fq_lb_often_a: "Une fois par mois. Chaque mise à jour est enregistrée comme un instantané figé dans les archives, pour voir comment l'ordre a changé."
fq_lb_moved:
  one: "{{ .name }} a gagné {{ .delta }} places depuis {{ .prev }}, la plus forte hausse de la liste. {{ .n }} outil a rejoint la liste ce mois-ci."
  other: "{{ .name }} a gagné {{ .delta }} places depuis {{ .prev }}, la plus forte hausse de la liste. {{ .n }} outils ont rejoint la liste ce mois-ci."
fq_lb_moved_nonew: "{{ .name }} a gagné {{ .delta }} places depuis {{ .prev }}, la plus forte hausse de la liste."
fq_lb_movers: "Quels outils d'IA ont le plus progressé ce mois-ci ?"
fq_lb_suggest: "On peut proposer un changement de classement ?"
fq_lb_suggest_a: "Oui. Passe par la page pour améliorer cette liste et envoyer une suggestion, ou soumets un outil qui manque à l'annuaire."
fq_ar_what: "C'est quoi, les archives du classement des outils d'IA ?"
fq_ar_what_a: "C'est une copie enregistrée du classement Best of AI, à la fin de chaque mois. Chaque instantané est figé : l'ordre affiché est celui qui était en ligne à ce moment-là."
fq_ar_far: "Jusqu'où remontent les archives ?"
