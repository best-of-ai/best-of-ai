about_p_org: "Best of AI est un annuaire d'outils d'IA sélectionné, tenu par l'organisation <a href=\"{{ .url }}\" target=\"_blank\" rel=\"noopener\">best-of-ai</a> sur GitHub. Pas d'entreprise derrière, pas de capital-risque, rien à payer. C'est une liste d'outils rangée pour trouver ce qu'il te faut, sans classements sponsorisés ni sites d'avis payants."
about_p_index: "L'index complet est sur <a href=\"{{ .url }}\">/index.json</a>. Tu peux le récupérer, en faire un fork, ou construire quelque chose par-dessus. Pas besoin de compte ni de clé d'API."
about_p_repo: "Le <a href=\"{{ .url }}\" target=\"_blank\" rel=\"noopener\">dépôt</a> a des modèles pour proposer un nouvel outil ou signaler un problème. Les corrections passent en général vite : garder les données dans des fichiers plats, c'est pour que les contributions soient simples à relire et à fusionner."
contribute_p_pr: "Chaque contribution passe par un issue ou un pull request GitHub. Les données sont du Markdown simple : chaque outil est un fichier <code>.md</code> dans <a href=\"{{ .url }}\" target=\"_blank\" rel=\"noopener\">content/tools/</a>. Si tu connais Git, laisse les formulaires et ouvre un pull request directement."
edit_p_file: "Modifie le fichier de l'outil directement dans <a href=\"{{ .url }}\" target=\"_blank\" rel=\"noopener\">content/tools/</a> sur GitHub et ouvre un pull request. Le nom de chaque fichier correspond au slug de l'outil."
edit_p_report: "Si l'outil n'est plus en ligne ou n'a pas sa place dans l'annuaire, passe par la <a href=\"{{ .url }}\">page de signalement</a>."
improve_p_file: "Tu peux modifier les fichiers d'outils directement dans <a href=\"{{ .url }}\" target=\"_blank\" rel=\"noopener\">content/tools/</a> sur GitHub et ouvrir un pull request. Le nom de chaque fichier correspond au slug de l'outil."
free_faq_writing: "ChatGPT, Claude et Gemini ont tous une offre gratuite correcte pour écrire. La catégorie <a href=\"{{ .url }}\">Assistants d'écriture</a> a la liste complète."
free_faq_image: "Oui. Plusieurs outils, dont Adobe Firefly, font de la génération d'images gratuite. Voir la catégorie <a href=\"{{ .url }}\">Génération d'images</a>."
