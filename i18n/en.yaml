about_p_org: "Best of AI is a curated directory of AI tools, run by the <a href=\"{{ .url }}\" target=\"_blank\" rel=\"noopener\">best-of-ai</a> organization on GitHub. There's no company behind it, no VC funding, and nothing to pay. It's a list of tools organized so you can find what you need without wading through sponsored rankings or paywalled review sites."
about_p_index: "The full index is available at <a href=\"{{ .url }}\">/index.json</a>. You can pull it, fork it, or build something on top of it. You don't need an account or an API key to use it."
about_p_repo: "The <a href=\"{{ .url }}\" target=\"_blank\" rel=\"noopener\">repository</a> has templates for submitting a new tool or reporting a problem. Fixes usually go through fast — the whole point of keeping the data in flat files is that contributions are easy to review and merge."
contribute_p_pr: "Every contribution goes through a GitHub issue or pull request. The data is plain Markdown: each tool is one <code>.md</code> file in <a href=\"{{ .url }}\" target=\"_blank\" rel=\"noopener\">content/tools/</a>. If you know Git, skip the forms and open a PR directly."
