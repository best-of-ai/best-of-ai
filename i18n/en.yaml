fq_lb_best_in: "What was the best AI tool in {{ .period }}?"
fq_lb_best_in_a: "{{ .n1 }} was ranked #1 in {{ .period }}, followed by {{ .n2 }} and {{ .n3 }}. Best of AI ranks tools by real-world usefulness and impact."
