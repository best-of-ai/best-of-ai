about_p_org: "Best of AI es un directorio curado de herramientas de IA, mantenido por la organización <a href=\"{{ .url }}\" target=\"_blank\" rel=\"noopener\">best-of-ai</a> en GitHub. No hay ninguna empresa detrás, ni capital de riesgo, ni nada que pagar. Es una lista de herramientas organizada para que encuentres lo que necesitas sin abrirte paso entre rankings patrocinados o sitios de reseñas de pago."
about_p_index: "El índice completo está disponible en <a href=\"{{ .url }}\">/index.json</a>. Puedes descargarlo, bifurcarlo o construir algo encima. No necesitas una cuenta ni una clave de API para usarlo."
about_p_repo: "El <a href=\"{{ .url }}\" target=\"_blank\" rel=\"noopener\">repositorio</a> tiene plantillas para enviar una herramienta nueva o reportar un problema. Las correcciones suelen aprobarse rápido: la razón de guardar los datos en archivos planos es que las contribuciones sean fáciles de revisar e integrar."
contribute_p_pr: "Toda contribución pasa por un issue o un pull request de GitHub. Los datos son Markdown simple: cada herramienta es un archivo <code>.md</code> en <a href=\"{{ .url }}\" target=\"_blank\" rel=\"noopener\">content/tools/</a>. Si sabes usar Git, sáltate los formularios y abre un PR directamente."
edit_p_file: "Edita directamente el archivo de la herramienta en <a href=\"{{ .url }}\" target=\"_blank\" rel=\"noopener\">content/tools/</a> en GitHub y abre un PR. El nombre de cada archivo coincide con el slug de la herramienta."
edit_p_report: "Si la herramienta ya no está activa o no encaja en el directorio, usa la <a href=\"{{ .url }}\">página de reportes</a>."
improve_p_file: "Puedes editar los archivos de las herramientas directamente en <a href=\"{{ .url }}\" target=\"_blank\" rel=\"noopener\">content/tools/</a> en GitHub y abrir un PR. El nombre de cada archivo coincide con el slug de la herramienta."
free_faq_writing: "ChatGPT, Claude y Gemini tienen buenos niveles gratuitos para escribir. Consulta la categoría <a href=\"{{ .url }}\">Asistentes de escritura</a> para ver la lista completa."
free_faq_image: "Sí. Varias herramientas, entre ellas Adobe Firefly, ofrecen generación de imágenes gratuita. Consulta la categoría <a href=\"{{ .url }}\">Generación de imágenes</a>."
