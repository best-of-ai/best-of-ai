# FAQ text and structured data (partials/*-faq.html, partials/seo-jsonld.html)
fq_lb_best_in: "¿Cuál fue la mejor herramienta de IA en {{ .period }}?"
fq_lb_best_in_a: "{{ .n1 }} quedó en el puesto n.º 1 en {{ .period }}, seguida de {{ .n2 }} y {{ .n3 }}. Best of AI ordena las herramientas por su utilidad e impacto en el mundo real."
fq_lb_current: "¿Sigue vigente este ranking?"
fq_lb_current_a: "No. Esta página es una instantánea congelada del ranking de {{ .period }}. El ranking actual tiene el orden más reciente."
fq_lb_climb: "¿Qué herramienta de IA subió más en {{ .period }}?"
fq_lb_climb_a: "{{ .name }} subió {{ .n }} puestos desde {{ .prev }}, el mayor salto de la lista."
fq_lb_best_now: "¿Cuál es la mejor herramienta de IA ahora mismo?"
fq_lb_best_now_a: "{{ .n1 }} ocupa el puesto n.º 1 del ranking de {{ .period }}, seguida de {{ .n2 }} y {{ .n3 }}. El ranking refleja la utilidad y el impacto en el mundo real, no solo las puntuaciones de benchmarks."
fq_lb_how: "¿Cómo se ordenan las herramientas de IA en este ranking?"
fq_lb_how_a: "Las herramientas se ordenan por su utilidad e impacto en el mundo real: cuánto ayudan a la gente a sacar el trabajo adelante, cuánto se confía en ellas y cuánto influyen en lo que hacen otras herramientas. La lista abarca {{ .n }} herramientas en {{ .cats }} categorías."
fq_lb_often: "¿Con qué frecuencia se actualiza el ranking?"
fq_lb_often_a: "Una vez al mes. Cada actualización se guarda como una instantánea congelada en el archivo del ranking, así que puedes ver cómo cambió el orden con el tiempo."
fq_lb_moved:
