submit_faq_form: "Abre el formulario de envío en <a href=\"{{ .url }}\" target=\"_blank\" rel=\"noopener\">submit.bestofai.io</a> y rellena el nombre de tu herramienta, su sitio web y una descripción breve. Lleva unos dos minutos."
