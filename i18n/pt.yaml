fq_lb_best_in: Qual foi a melhor ferramenta de IA em {{ .period }}?
fq_lb_best_in_a: '{{ .n1 }} ficou em primeiro lugar em {{ .period }}, seguida por
  {{ .n2 }} e {{ .n3 }}. O Best of AI classifica ferramentas pela utilidade e impacto
  no mundo real.'
fq_lb_current: Este ranking ainda está atualizado?
fq_lb_current_a: Não. Esta página mostra uma versão congelada do ranking de {{ .period
  }}. Consulte o ranking atual para ver a ordem mais recente.
fq_lb_climb: Qual ferramenta de IA mais subiu em {{ .period }}?
fq_lb_climb_a: '{{ .name }} subiu {{ .n }} posições desde {{ .prev }}, a maior alta
  da lista.'
fq_lb_best_now: Qual é a melhor ferramenta de IA atualmente?
fq_lb_best_now_a: '{{ .n1 }} está em primeiro lugar no ranking de {{ .period }}, seguida
  por {{ .n2 }} e {{ .n3 }}. A classificação considera utilidade e impacto no mundo
  real, não apenas pontuações de benchmarks.'
fq_lb_how: Como as ferramentas de IA são classificadas neste ranking?
fq_lb_how_a: 'As ferramentas são classificadas pela utilidade e impacto no mundo real:
  quanto ajudam as pessoas a trabalhar, quão amplamente são usadas e quanto influenciam
  outras ferramentas. A lista reúne {{ .n }} ferramentas em {{ .cats }} categorias.'
fq_lb_often: Com que frequência o ranking é atualizado?
fq_lb_often_a: Uma vez por mês. Cada atualização é salva como uma versão congelada
  no arquivo do ranking, para que você acompanhe as mudanças ao longo do tempo.
fq_lb_moved:
  one: '{{ .name }} subiu {{ .delta }} posições desde {{ .prev }}, a maior alta da
    lista. {{ .n }} ferramenta entrou na lista neste mês.'
  other: '{{ .name }} subiu {{ .delta }} posições desde {{ .prev }}, a maior alta
    da lista. {{ .n }} ferramentas entraram na lista neste mês.'
fq_lb_moved_nonew: '{{ .name }} subiu {{ .delta }} posições desde {{ .prev }}, a maior
  alta da lista.'
fq_lb_movers: Quais ferramentas de IA mais subiram neste mês?
fq_lb_suggest: Posso sugerir uma alteração no ranking?
fq_lb_suggest_a: Sim. Use a página para melhorar esta lista e envie uma sugestão,
  ou envie uma ferramenta que esteja faltando no diretório.
fq_ar_what: O que é o arquivo do ranking de ferramentas de IA?
fq_ar_what_a: É uma cópia do ranking do Best of AI salva no fim de cada mês. Cada
  versão fica congelada, mostrando a ordem que estava valendo naquele momento.
fq_ar_far: Até quando vai o arquivo?
fq_ar_far_a:
  one: O arquivo tem {{ .n }} versão mensal, de {{ .first }} a {{ .last }}. Uma nova
    é adicionada todo mês, quando o ranking é atualizado.
  other: O arquivo tem {{ .n }} versões mensais, de {{ .first }} a {{ .last }}. Uma
    nova é adicionada todo mês, quando o ranking é atualizado.
fq_ar_change: Como vejo a mudança de posição de uma ferramenta de IA ao longo do tempo?
fq_ar_change_a: Abra duas versões e compare a posição da ferramenta. Cada versão também
  indica quais ferramentas subiram, caíram ou foram adicionadas em relação ao mês
  anterior.
fq_ar_current: Onde encontro o ranking atual de ferramentas de IA?
fq_ar_current_a: O ranking atual mostra a ordem mais recente e é a página certa para
  escolher uma ferramenta hoje. As versões arquivadas servem para consultar o histórico,
  não para recomendações atuais.
