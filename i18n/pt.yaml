about_p_org: O Best of AI é um diretório selecionado de ferramentas de IA, mantido
  pela organização <a href="{{ .url }}" target="_blank" rel="noopener">best-of-ai</a>
  no GitHub. Não há uma empresa por trás, financiamento de capital de risco nem cobrança
  pelo uso. A lista organiza as ferramentas para ajudar você a encontrar o que precisa
  sem rankings patrocinados nem sites de avaliação pagos.
about_p_index: O índice completo está disponível em <a href="{{ .url }}">/index.json</a>.
  Você pode baixá-lo, criar uma cópia ou desenvolver algo a partir dele. Não precisa
  de conta nem chave de API para usá-lo.
about_p_repo: O <a href="{{ .url }}" target="_blank" rel="noopener">repositório</a>
  tem modelos para enviar uma ferramenta ou relatar um problema. As correções costumam
  ser integradas rapidamente. Manter os dados em arquivos simples facilita a análise
  e a integração das contribuições.
contribute_p_pr: 'Toda contribuição passa por uma issue ou pull request no GitHub.
  Os dados estão em Markdown: cada ferramenta é um arquivo <code>.md</code> em <a
  href="{{ .url }}" target="_blank" rel="noopener">content/tools/</a>. Se você conhece
  Git, pode pular os formulários e abrir um PR diretamente.'
edit_p_file: Edite diretamente o arquivo da ferramenta em <a href="{{ .url }}" target="_blank"
  rel="noopener">content/tools/</a> no GitHub e abra um PR. O nome do arquivo corresponde
  ao slug da ferramenta.
edit_p_report: Se a ferramenta saiu do ar ou não deveria estar no diretório, use a
  <a href="{{ .url }}">página de relato</a>.
improve_p_file: Você pode editar diretamente os arquivos das ferramentas em <a href="{{
  .url }}" target="_blank" rel="noopener">content/tools/</a> no GitHub e abrir um
  PR. O nome de cada arquivo corresponde ao slug da ferramenta.
free_faq_writing: ChatGPT, Claude e Gemini oferecem bons planos gratuitos para escrita.
  Consulte a categoria <a href="{{ .url }}">Assistentes de escrita</a> para ver a
  lista completa.
free_faq_image: Sim. Várias ferramentas, incluindo o Adobe Firefly, oferecem geração
  gratuita de imagens. Veja a categoria <a href="{{ .url }}">Geração de imagens</a>.
lb_archive_desc: Veja como estava o ranking em {{ .period }}. Esta versão está congelada.
