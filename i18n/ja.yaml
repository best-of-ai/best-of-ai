# FAQ text and structured data (partials/*-faq.html, partials/seo-jsonld.html)
fq_lb_best_in: "{{ .period }}のAIツールで1位だったのは何ですか？"
fq_lb_best_in_a: "{{ .period }}の1位は{{ .n1 }}で、次が{{ .n2 }}、その次が{{ .n3 }}でした。Best of AIは、実際の役立ち方と影響でツールを並べています。"
fq_lb_current: "この順位は今も有効ですか？"
fq_lb_current_a: "いいえ。このページは{{ .period }}のランキングを固定したスナップショットです。最新の順は現在のランキングにあります。"
fq_lb_climb: "{{ .period }}で最も順位を上げたAIツールは何ですか？"
fq_lb_climb_a: "{{ .name }}は{{ .prev }}から{{ .n }}位上がり、この一覧で最大の上昇です。"
fq_lb_best_now: "今いちばん上のAIツールは何ですか？"
fq_lb_best_now_a: "{{ .period }}のランキングで1位は{{ .n1 }}、次が{{ .n2 }}、その次が{{ .n3 }}です。順位が見ているのは実際の役立ち方と影響で、ベンチマークの点数だけではありません。"
fq_lb_how: "このランキングでは、AIツールをどう並べていますか？"
fq_lb_how_a: "実際の役立ち方と影響で並べています。仕事がどれだけ進むか、どれだけ頼られているか、ほかのツールの動きにどれだけ影響するか、です。一覧は{{ .cats }}カテゴリにわたる{{ .n }}件のツールです。"
fq_lb_often: "ランキングの更新はどのくらいの頻度ですか？"
fq_lb_often_a: "月に1回です。更新のたびにランキングのアーカイブへ、固定したスナップショットとして残るので、順位の変化をあとから見られます。"
fq_lb_moved:
  one: "{{ .name }}は{{ .prev }}から{{ .delta }}位上がり、この一覧で最大の上昇です。今月は{{ .n }}件のツールが加わりました。"
  other: "{{ .name }}は{{ .prev }}から{{ .delta }}位上がり、この一覧で最大の上昇です。今月は{{ .n }}件のツールが加わりました。"
fq_lb_moved_nonew: "{{ .name }}は{{ .prev }}から{{ .delta }}位上がり、この一覧で最大の上昇です。"
fq_lb_movers: "今月、順位を最も上げたAIツールはどれですか？"
fq_lb_suggest: "順位の変更を提案できますか？"
fq_lb_suggest_a: "はい。この一覧を改善するページから提案を送るか、ディレクトリにないツールを投稿してください。"
fq_ar_what: "AIツールランキングのアーカイブとは何ですか？"
fq_ar_what_a: "毎月末のBest of AIランキングを保存したコピーです。どのスナップショットも固定されているので、表示されている順は、その時点で公開されていた順です。"
fq_ar_far: "アーカイブはどこまでさかのぼりますか？"
fq_ar_far_a:
  one: "アーカイブには{{ .first }}から{{ .last }}まで、月次スナップショットが{{ .n }}件あります。ランキングの更新に合わせて、毎月1件追加されます。"
  other: "アーカイブには{{ .first }}から{{ .last }}まで、月次スナップショットが{{ .n }}件あります。ランキングの更新に合わせて、毎月1件追加されます。"
fq_ar_change: "AIツールの順位が時間とともにどう変わったか、どう見ますか？"
fq_ar_change_a: "スナップショットを2つ開いて、ツールの位置を比べます。各スナップショットには、前月と比べて上がったもの、下がったもの、新しく入ったものにも印が付きます。"
fq_ar_current: "今のAIツール順位はどこにありますか？"
fq_ar_current_a: "現在のランキングが最新の順です。今日ツールを選ぶなら、そのページを使ってください。アーカイブのスナップショットは過去を見るためのもので、今のおすすめではありません。"
