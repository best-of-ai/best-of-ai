about_p_org: "Best of AIは、選んだAIツールのディレクトリで、GitHubの<a href=\"{{ .url }}\" target=\"_blank\" rel=\"noopener\">best-of-ai</a>オーガニゼーションが運営しています。後ろに会社はなく、VCからの資金もなく、払うものもありません。スポンサー順位や有料のレビューサイトをかき分けなくても、必要なものが見つかるように並べた一覧です。"
about_p_index: "一覧の全体は<a href=\"{{ .url }}\">/index.json</a>にあります。取得しても、フォークしても、その上に何かを作ってもかまいません。使うのにアカウントもAPIキーも要りません。"
about_p_repo: "<a href=\"{{ .url }}\" target=\"_blank\" rel=\"noopener\">リポジトリ</a>には、新しいツールの投稿と問題の報告用のテンプレートがあります。修正はたいてい早く通ります。データをフラットなファイルに置いているのは、貢献の確認とマージを簡単にするためです。"
contribute_p_pr: "貢献はどれも、GitHubのissueかpull requestを通ります。データは普通のMarkdownで、各ツールは<code>.md</code>ファイル1つで、<a href=\"{{ .url }}\" target=\"_blank\" rel=\"noopener\">content/tools/</a>にあります。Gitが使えるなら、フォームを飛ばしてPRを直接開いてください。"
edit_p_file: "GitHubの<a href=\"{{ .url }}\" target=\"_blank\" rel=\"noopener\">content/tools/</a>でツールのファイルを直接編集し、PRを開いてください。ファイル名はツールのスラッグと一致します。"
edit_p_report: "ツールがもう公開されていない、またはディレクトリに合わない場合は、代わりに<a href=\"{{ .url }}\">報告ページ</a>を使ってください。"
improve_p_file: "GitHubの<a href=\"{{ .url }}\" target=\"_blank\" rel=\"noopener\">content/tools/</a>でツールのファイルを直接編集し、PRを開けます。ファイル名はツールのスラッグと一致します。"
free_faq_writing: "文章作成なら、ChatGPT、Claude、Geminiのいずれにも無料枠があります。一覧は<a href=\"{{ .url }}\">執筆アシスタント</a>カテゴリにあります。"
free_faq_image: "はい。Adobe Fireflyを含むいくつかのツールが、無料の画像生成を提供しています。<a href=\"{{ .url }}\">画像生成</a>カテゴリを見てください。"
