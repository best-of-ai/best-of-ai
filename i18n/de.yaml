about_p_org: Best of AI ist ein kuratiertes Verzeichnis für KI-Tools, betrieben von der Organisation <a href="{{ .url }}"
  target="_blank" rel="noopener">best-of-ai</a> auf GitHub. Dahinter steht kein Unternehmen, es gibt keine VC-Finanzierung
  und nichts ist kostenpflichtig. Die Tools sind so geordnet, dass du findest, was du brauchst, ohne dich durch gesponserte
  Ranglisten oder kostenpflichtige Testberichte zu arbeiten.
about_p_index: Der vollständige Index ist unter <a href="{{ .url }}">/index.json</a> verfügbar. Du kannst ihn abrufen, forken
  oder darauf aufbauen. Für die Nutzung brauchst du weder ein Konto noch einen API-Schlüssel.
about_p_repo: Im <a href="{{ .url }}" target="_blank" rel="noopener">Repository</a> findest du Vorlagen, um ein neues Tool
  einzureichen oder ein Problem zu melden. Korrekturen werden meist schnell übernommen. Ein Grund für einfache Dateien ist,
  dass Beiträge leicht geprüft und zusammengeführt werden können.
contribute_p_pr: 'Jeder Beitrag läuft über ein GitHub-Issue oder einen Pull Request. Die Daten liegen als einfaches Markdown
  vor: Jedes Tool ist eine einzelne <code>.md</code>-Datei unter <a href="{{ .url }}" target="_blank" rel="noopener">content/tools/</a>.
  Wenn du Git kennst, kannst du die Formulare überspringen und direkt einen PR öffnen.'
edit_p_file: Bearbeite die Datei des Tools direkt auf GitHub unter <a href="{{ .url }}" target="_blank" rel="noopener">content/tools/</a>
  und öffne einen PR. Der Dateiname entspricht dem Slug des Tools.
edit_p_report: Wenn das Tool nicht mehr verfügbar ist oder nicht ins Verzeichnis gehört, nutze stattdessen die <a href="{{
  .url }}">Meldeseite</a>.
improve_p_file: Du kannst Tool-Dateien direkt auf GitHub unter <a href="{{ .url }}" target="_blank" rel="noopener">content/tools/</a>
  bearbeiten und einen PR öffnen. Der Dateiname entspricht jeweils dem Tool-Slug.
free_faq_writing: ChatGPT, Claude und Gemini bieten alle gute kostenlose Tarife zum Schreiben. In der Kategorie <a href="{{
  .url }}">Schreibassistenten</a> findest du die vollständige Liste.
free_faq_image: Ja. Mehrere Tools, darunter Adobe Firefly, ermöglichen kostenlose Bildgenerierung. Sieh dir die Kategorie
  <a href="{{ .url }}">Bildgenerierung</a> an.
lb_archive_desc: So sah die Rangliste im Zeitraum {{ .period }} aus. Diese Rangliste ist eingefroren. Die aktuelle Reihenfolge
  findest du auf der <a href="{{ .url }}">aktuellen Rangliste</a>.
submit_faq_form: Öffne das Einreichungsformular unter <a href="{{ .url }}" target="_blank" rel="noopener">submit.bestofai.io</a>
  und gib den Namen deines Tools, die Website und eine kurze Beschreibung ein. Das dauert etwa zwei Minuten.
prof_list_sub: Handverlesene KI-Tools für <strong>{{ .n }}</strong> Berufe – finde Tools für deine Tätigkeit.
co_sub_lede: Die vollständige Liste von {{ .what }} von <a href="{{ .url }}">{{ .name }}</a>, sortiert nach Bewertung.
companies_intro: Dieses Verzeichnis umfasst {{ .n }} KI-Unternehmen – von führenden Laboren wie {{ .names }} bis zu kleinen
