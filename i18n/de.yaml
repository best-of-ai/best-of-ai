fq_lb_best_in: Welches KI-Tool war im {{ .period }} das beste?
fq_lb_best_in_a: '{{ .n1 }} stand im {{ .period }} auf Platz 1, gefolgt von {{ .n2 }} und {{ .n3 }}. Best of AI bewertet Tools
  nach ihrem praktischen Nutzen und ihrer Wirkung.'
fq_lb_current: Ist diese Rangliste noch aktuell?
fq_lb_current_a: Nein. Diese Seite zeigt einen eingefrorenen Stand der Rangliste vom {{ .period }}. Die aktuelle Rangliste
  enthält die neuesten Platzierungen.
fq_lb_climb: Welches KI-Tool ist im {{ .period }} am stärksten aufgestiegen?
fq_lb_climb_a: '{{ .name }} ist seit {{ .prev }} um {{ .n }} Plätze gestiegen – der größte Sprung in der Liste.'
fq_lb_best_now: Was ist derzeit das beste KI-Tool?
fq_lb_best_now_a: '{{ .n1 }} steht auf Platz 1 der Rangliste für {{ .period }}, gefolgt von {{ .n2 }} und {{ .n3 }}. Die Rangliste
  spiegelt den praktischen Nutzen und die Wirkung wider, nicht nur Benchmark-Ergebnisse.'
fq_lb_how: Wie werden die KI-Tools in dieser Rangliste bewertet?
fq_lb_how_a: 'Die Bewertung richtet sich nach praktischem Nutzen und Wirkung: Wie sehr helfen die Tools bei der Arbeit, wie
  viele Menschen verlassen sich darauf und wie stark beeinflussen sie andere Tools? Die Liste umfasst {{ .n }} Tools aus {{
  .cats }} Kategorien.'
fq_lb_often: Wie oft wird die Rangliste aktualisiert?
fq_lb_often_a: Einmal im Monat. Jede Aktualisierung wird als eingefrorener Stand im Ranglistenarchiv gespeichert, damit du
  sehen kannst, wie sich die Reihenfolge verändert hat.
fq_lb_moved:
  one: '{{ .name }} ist seit {{ .prev }} um {{ .delta }} Plätze gestiegen – der größte Sprung in der Liste. Diesen Monat kam
    {{ .n }} Tool neu dazu.'
  other: '{{ .name }} ist seit {{ .prev }} um {{ .delta }} Plätze gestiegen – der größte Sprung in der Liste. Diesen Monat
    kamen {{ .n }} Tools neu dazu.'
fq_lb_moved_nonew: '{{ .name }} ist seit {{ .prev }} um {{ .delta }} Plätze gestiegen – der größte Sprung in der Liste.'
fq_lb_movers: Welche KI-Tools sind diesen Monat am stärksten aufgestiegen?
fq_lb_suggest: Kann ich eine Änderung an der Rangliste vorschlagen?
fq_lb_suggest_a: Ja. Nutze die Seite „Liste verbessern“, um einen Vorschlag zu senden, oder reiche ein Tool ein, das im Verzeichnis
  fehlt.
fq_ar_what: Was ist das Archiv der KI-Tool-Rangliste?
fq_ar_what_a: Es ist eine gespeicherte Kopie der Best-of-AI-Rangliste vom Ende jedes Monats. Jeder Stand ist eingefroren und
  zeigt die Reihenfolge, die zu diesem Zeitpunkt galt.
fq_ar_far: Wie weit reicht das Archiv zurück?
fq_ar_far_a:
  one: Das Archiv enthält {{ .n }} monatlichen Stand von {{ .first }} bis {{ .last }}. Mit jeder Aktualisierung der Rangliste
    kommt ein neuer hinzu.
  other: Das Archiv enthält {{ .n }} monatliche Stände von {{ .first }} bis {{ .last }}. Mit jeder Aktualisierung der Rangliste
    kommt ein neuer hinzu.
fq_ar_change: Wie kann ich sehen, wie sich die Ranglistenposition eines KI-Tools verändert hat?
fq_ar_change_a: Öffne zwei beliebige Stände und vergleiche die Position des Tools. Jeder Stand kennzeichnet außerdem Tools,
