<div id="newsletter-modal" class="gs-modal" hidden aria-modal="true" role="dialog" aria-labelledby="gs-modal-title">
  <div class="gs-modal__backdrop" id="gs-modal-backdrop"></div>
  <div class="gs-modal__box">
    <button class="gs-modal__close" id="gs-modal-close" aria-label="Close">✕</button>
    <div class="gs-modal__icon" aria-hidden="true">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 7 10-7"/></svg>
    </div>
    <h2 id="gs-modal-title" class="gs-modal__title">Stay on top of new AI tools</h2>
    <p class="gs-modal__body">Best of AI is free to use with no account or paywall. Get a weekly roundup of new tools and releases in your inbox.</p>
    <div class="gs-modal__embed">
      <iframe src="https://newsletter.altern.ai/embed" width="480" height="320" style="border: 1px solid #EEE; background: white" frameborder="0" scrolling="no" title="Subscribe to the Altern newsletter"></iframe>
    </div>
    <div class="gs-modal__actions">
      <button class="gs-modal__dismiss" id="gs-modal-dismiss">Maybe later</button>
    </div>
  </div>
</div>

<script>
(function () {
  var STORAGE_KEY = 'bai-newsletter-dismiss';
  var MONTH_MS = 30 * 24 * 60 * 60 * 1000;

  var stored = localStorage.getItem(STORAGE_KEY);
  if (stored && Date.now() - parseInt(stored, 10) < MONTH_MS) return;

  var modal = document.getElementById('newsletter-modal');

  function open() {
    modal.removeAttribute('hidden');
    document.getElementById('gs-modal-close').focus();
  }

  function close() {
    modal.setAttribute('hidden', '');
    localStorage.setItem(STORAGE_KEY, String(Date.now()));
  }

  setTimeout(open, 20000);

  document.getElementById('gs-modal-backdrop').addEventListener('click', close);
  document.getElementById('gs-modal-close').addEventListener('click', close);
  document.getElementById('gs-modal-dismiss').addEventListener('click', close);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !modal.hasAttribute('hidden')) close();
  });
})();
</script>
