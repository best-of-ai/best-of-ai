<div id="github-star-modal" class="gs-modal" hidden aria-modal="true" role="dialog" aria-labelledby="gs-modal-title">
  <div class="gs-modal__backdrop" id="gs-modal-backdrop"></div>
  <div class="gs-modal__box">
    <button class="gs-modal__close" id="gs-modal-close" aria-label="Close">✕</button>
    <div class="gs-modal__icon" aria-hidden="true">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
    </div>
    <h2 id="gs-modal-title" class="gs-modal__title">100% Free &amp; Open Source</h2>
    <p class="gs-modal__body">Best of AI is completely free — no account, no paywall, no ads. The whole thing lives on GitHub. If it's been useful to you, a star goes a long way.</p>
    <div class="gs-modal__actions">
      <a href="{{ .Site.Params.githubRepo }}" target="_blank" rel="noopener" class="gs-modal__star-btn" id="gs-modal-star">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        Star on GitHub
      </a>
      <button class="gs-modal__dismiss" id="gs-modal-dismiss">Maybe later</button>
    </div>
  </div>
</div>

<script>
(function () {
  var STORAGE_KEY = 'bai-gh-star-dismiss';
  var MONTH_MS = 30 * 24 * 60 * 60 * 1000;

  var stored = localStorage.getItem(STORAGE_KEY);
  if (stored && Date.now() - parseInt(stored, 10) < MONTH_MS) return;

  var modal = document.getElementById('github-star-modal');

  function open() {
    modal.removeAttribute('hidden');
    document.getElementById('gs-modal-close').focus();
  }

  function close() {
    modal.setAttribute('hidden', '');
    localStorage.setItem(STORAGE_KEY, String(Date.now()));
  }

  setTimeout(open, 20000);

  document.getElementById('gs-modal-backdrop').addEventListener('click', close);
  document.getElementById('gs-modal-close').addEventListener('click', close);
  document.getElementById('gs-modal-dismiss').addEventListener('click', close);

  document.getElementById('gs-modal-star').addEventListener('click', function (e) {
    e.preventDefault();
    close();
    window.open(e.currentTarget.href, '_blank', 'noopener');
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !modal.hasAttribute('hidden')) close();
  });
})();
</script>
