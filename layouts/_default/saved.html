{{ define "main" }}
<div class="home-layout">

  {{ partialCached "left-sidebar.html" . (partial "nav-key.html" .) }}

  <main class="hl-center">

    <div class="hl-hero">
      <h1 class="hl-hero__title">Saved Tools</h1>
      <p class="hl-hero__desc">Tools you've bookmarked to revisit later.</p>
    </div>

    <div class="tools-grid" id="saved-grid"></div>

    <div id="saved-empty" hidden style="padding:3rem 0;text-align:center">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--fg-faint)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:1rem"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      <p style="color:var(--fg-muted);margin-bottom:0.75rem">No saved tools yet.</p>
      <a href="{{ "/" | relURL }}" class="btn btn-primary" style="display:inline-flex">Browse AI tools</a>
    </div>

  </main>

  {{ partialCached "right-sidebar.html" . (partial "right-sidebar-key.html" .) }}

</div>

<script>
(function () {
  var grid  = document.getElementById('saved-grid');
  var empty = document.getElementById('saved-empty');

  function esc(s) {
    return String(s || '').replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var PRICE_ICON = {
    'Free':     '<span class="tool-card__price-icon price-free" title="Free"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg></span>',
    'Freemium': '<span class="tool-card__price-icon price-freemium" title="Freemium"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></span>',
    'Paid':     '<span class="tool-card__price-icon price-paid" title="Paid"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></span>'
  };

  var EXT  = '<svg class="tool-card__ext" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';
  var SAVE = '<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>';

  function renderCard(slug, t) {
    var logoSrc = t.logo_url
      ? esc(t.logo_url)
      : 'https://www.google.com/s2/favicons?domain=' + encodeURIComponent(t.website || '') + '&sz=32';
    var desc = t.subtitle || (t.description || '').slice(0, 80);
    var infoAttr = esc(JSON.stringify(t));
    var saveBtn = '<button class="tool-card__save js-save-btn is-saved"'
      + ' data-slug="' + esc(slug) + '"'
      + ' data-info="' + infoAttr + '"'
      + ' title="Remove from saved" aria-pressed="true">' + SAVE + '</button>';

    return '<a href="' + esc(t.url || '') + '" class="tool-card" data-price="' + esc(t.price || '') + '">'
      + '<div class="tool-card__logo">'
      + '<img src="' + logoSrc + '" alt="' + esc(t.name || '') + '" loading="lazy"'
      + ' onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">'
      + '<span class="tool-logo-fallback" style="display:none">' + esc((t.name || '').charAt(0)) + '</span>'
      + '</div>'
      + '<div class="tool-card__body">'
      + '<span class="tool-card__name">' + esc(t.name || '') + '</span>'
      + '<span class="tool-card__desc">' + esc(desc) + '</span>'
      + '</div>'
      + (PRICE_ICON[t.price] || '')
      + EXT
      + saveBtn
      + '</a>';
  }

  function render() {
    if (!window.baiSaved) { setTimeout(render, 20); return; }
    var saved = window.baiSaved.get();
    var slugs = Object.keys(saved);
    if (slugs.length === 0) {
      empty.hidden = false;
      return;
    }
    empty.hidden = true;
    grid.innerHTML = slugs.map(function (slug) {
      return renderCard(slug, saved[slug]);
    }).join('');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', render);
  } else {
    render();
  }
})();
</script>
{{ end }}
